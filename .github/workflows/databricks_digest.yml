name: Digest CI and daily delivery

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: release-notes-digest
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.12.12"

jobs:
  build:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Scan dependencies
        run: uv audit --frozen
      - name: Install dependencies
        run: uv sync --locked --all-groups --all-extras
        env:
          UV_MALWARE_CHECK: 1
      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Test with pytest
        run: |
          uv run pytest --doctest-modules --junitxml=junit/test-results-${{ env.PYTHON_VERSION }}.xml \
          --cov=src --cov=scripts --cov-report=xml --cov-report=html
      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-${{ env.PYTHON_VERSION }}
          path: junit/test-results-${{ env.PYTHON_VERSION }}.xml
        if: ${{ always() }}
      - name: Code Coverage Summary Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: "coverage.xml"
          badge: true
          format: "markdown"
          output: "both"
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v3
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
      - name: Write to Job Summary
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

  digest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Restore SQLite digest state
        uses: actions/cache/restore@v4
        with:
          path: data/release_notes.sqlite3
          key: release-notes-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: release-notes-state-
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --locked --all-groups --all-extras
      - name: Fetch and email release notes
        run: uv run python src/databricks_digest.py
        env:
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Save SQLite digest state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/release_notes.sqlite3
          key: release-notes-state-${{ github.run_id }}-${{ github.run_attempt }}
