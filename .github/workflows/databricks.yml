name: Databricks bundle CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency: databricks-bundle

permissions:
  contents: read
  pull-requests: write

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.12.12"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Scan dependencies
        run: uv audit --frozen
      - name: Install dependencies
        run: uv sync --locked --all-groups --all-extras
        env:
          UV_MALWARE_CHECK: 1
      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Test with pytest
        run: |
          uv run pytest --doctest-modules --junitxml=junit/test-results-${{ env.PYTHON_VERSION }}.xml \
          --cov=src --cov=scripts --cov-report=xml --cov-report=html
      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-${{ env.PYTHON_VERSION }}
          path: junit/test-results-${{ env.PYTHON_VERSION }}.xml
        if: ${{ always() }}
      - name: Code Coverage Summary Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: "coverage.xml"
          badge: true
          format: "markdown"
          output: "both"
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v3
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
      - name: Write to Job Summary
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
      - uses: databricks/setup-cli@main
      - name: Validate bundle
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate >/dev/null && echo "Validation OK!"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: databricks/setup-cli@main
      - name: Deploy bundle
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_BUNDLE_TARGET: prod
        run: databricks bundle deploy -t $DATABRICKS_BUNDLE_TARGET --force
