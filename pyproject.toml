[project]
name = "databricks-reddit-digest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["feedparser>=6.0", "python-dotenv>=1.0", "tzdata>=2024.1"]

[dependency-groups]
dev = ["genbadge[coverage]>=1.1", "pre-commit>=4.0", "pytest-cov>=6.0", "pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
