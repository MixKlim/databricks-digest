resources:
  jobs:
    databricks_digest:
      name: reddit-databricks-daily-digest
      description: Fetch new News and Event posts from r/databricks and email a daily digest.
      schedule:
        quartz_cron_expression: 0 0 8 * * ?
        timezone_id: Europe/Amsterdam
        pause_status: PAUSED
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - mixklim@gmail.com
      parameters:
        - name: digest_table
          default: ${var.catalog}.${var.schema}.databricks_digest_posts
        - name: secret_scope
          default: ${var.secret_scope}
      tasks:
        - task_key: fetch_filter_email
          spark_python_task:
            python_file: ../src/databricks_digest.py
            source: WORKSPACE
            parameters:
              - --digest-table
              - "{{job.parameters.digest_table}}"
              - --secret-scope
              - "{{job.parameters.secret_scope}}"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - feedparser>=6.0
              - tzdata>=2024.1
